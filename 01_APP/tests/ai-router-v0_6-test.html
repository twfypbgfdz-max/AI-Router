<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Router v0.6 Test</title><style>body{margin:0;background:#0f0f10;color:#e5e5e5;font:16px Arial,sans-serif}main{max-width:760px;margin:auto;padding:20px}.card{background:#1a1a1d;border:1px solid #323238;border-radius:14px;padding:18px}textarea,button{width:100%;box-sizing:border-box;border-radius:10px;padding:12px;font:inherit}textarea{min-height:150px;background:#25252a;color:#fff;border:1px solid #323238}button{margin-top:12px;background:#4f8cff;border:0;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#25252a;padding:12px;border-radius:10px}small{color:#a0a0a0}</style></head><body><main><section class="card"><h1>AI Router</h1><p>v0.6.0-test · Lokale Codex-Read-only-Analyse</p><label for="task">Aufgabe</label><textarea id="task" maxlength="8000" placeholder="Beschreibe eine Analyseaufgabe. Codex erhält nur Read-only-Zugriff."></textarea><button id="start" type="button">Read-only-Analyse starten</button><button id="cancel" type="button">Lauf abbrechen</button><p id="state" role="status">Bereit.</p><pre id="result">Noch kein Ergebnis.</pre><small>Keine Schreibaktionen, Commits, Pushes oder Websuche.</small></section></main><script>const state=document.querySelector('#state'),result=document.querySelector('#result'),task=document.querySelector('#task'),cancel=document.querySelector('#cancel');let activeRunId=null;cancel.onclick=async()=>{if(activeRunId)await fetch('/api/runs/'+encodeURIComponent(activeRunId)+'/cancel',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})};document.querySelector('#start').onclick=async()=>{state.textContent='Run wird gestartet…';result.textContent='';try{const r=await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({task:task.value})});let run=await r.json();if(!r.ok)throw new Error(run.error||'Start fehlgeschlagen');activeRunId=run.runId;const poll=async()=>{const x=await fetch('/api/runs/'+encodeURIComponent(run.runId));run=await x.json();state.textContent=run.status;if(['succeeded','failed','cancelled','timed_out'].includes(run.status)){activeRunId=null;result.textContent=run.resultSummary||run.errorSummary||'Kein Ergebnis.';return}setTimeout(poll,700)};poll()}catch(e){state.textContent='Fehler';result.textContent=e.message}};</script></body></html>
