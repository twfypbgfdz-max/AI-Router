<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Router v0.6 Test</title><style>body{margin:0;background:#0f0f10;color:#e5e5e5;font:16px Arial,sans-serif}main{max-width:760px;margin:auto;padding:20px}.card{background:#1a1a1d;border:1px solid #323238;border-radius:14px;padding:18px}textarea,select,button{width:100%;box-sizing:border-box;border-radius:10px;padding:12px;font:inherit}textarea,select{background:#25252a;color:#fff;border:1px solid #323238}textarea{min-height:150px}button{margin-top:12px;background:#4f8cff;border:0;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#25252a;padding:12px;border-radius:10px}small{color:#a0a0a0}label{display:block;margin-top:12px}</style></head><body><main><section class="card"><h1>AI Router</h1><p>v0.6.0-test · Lokale Read-only-Analyse und Simulation</p><label for="adapter">Adapter</label><select id="adapter"><option value="mock" selected>Simulation</option><option value="codex-cli">Codex Read-only</option></select><label for="simulation-mode">Simulationsmodus</label><select id="simulation-mode"><option value="success" selected>Erfolg</option><option value="failure">Kontrollierter Fehler</option><option value="timeout">Kontrollierter Timeout</option></select><label for="task">Aufgabe</label><textarea id="task" maxlength="8000" placeholder="Beschreibe eine Analyseaufgabe."></textarea><button id="start" type="button">Run starten</button><button id="cancel" type="button">Lauf abbrechen</button><p id="state" role="status">Bereit.</p><pre id="result">Noch kein Ergebnis.</pre><small>Simulation startet kein Modell. Codex bleibt fest auf Read-only begrenzt.</small></section></main><script>const state=document.querySelector('#state'),result=document.querySelector('#result'),task=document.querySelector('#task'),adapter=document.querySelector('#adapter'),simulationMode=document.querySelector('#simulation-mode'),cancel=document.querySelector('#cancel');let activeRunId=null;adapter.onchange=()=>{simulationMode.disabled=adapter.value!=='mock'};cancel.onclick=async()=>{if(activeRunId)await fetch('/api/runs/'+encodeURIComponent(activeRunId)+'/cancel',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})};document.querySelector('#start').onclick=async()=>{state.textContent='Run wird gestartet…';result.textContent='';try{const body={task:task.value,adapter:adapter.value};if(adapter.value==='mock')body.simulationMode=simulationMode.value;const r=await fetch('/api/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});let run=await r.json();if(!r.ok)throw new Error(run.error||'Start fehlgeschlagen');activeRunId=run.runId;const poll=async()=>{const x=await fetch('/api/runs/'+encodeURIComponent(run.runId));run=await x.json();state.textContent=run.status;if(['succeeded','failed','cancelled','timed_out'].includes(run.status)){activeRunId=null;result.textContent=run.resultSummary||run.errorSummary||'Kein Ergebnis.';return}setTimeout(poll,700)};poll()}catch(e){state.textContent='Fehler';result.textContent=e.message}};</script></body></html>
